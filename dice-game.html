<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player vs. Robot - Dice Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 600px;
            position: relative;
        }

        .players-container {
            display: flex;
            width: 100%;
            justify-content: space-between;
            margin-bottom: 40px;
            gap: 20px;
        }

        .player-card {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        .player-card.active {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
            transform: translateY(-5px);
        }

        /* Robot specific active styling */
        .player-card.robot.active {
            border-color: #f87171;
            background: rgba(248, 113, 113, 0.1);
            box-shadow: 0 0 20px rgba(248, 113, 113, 0.3);
        }

        .player-card h2 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #cbd5e1;
        }

        .total-score {
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .current-score-box {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
        }

        .current-score-label {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .current-score {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fbbf24;
        }

        .dice-area {
            perspective: 1000px;
            margin-bottom: 40px;
            position: relative;
        }

        .dice {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s ease-out;
            transform: rotateX(0deg) rotateY(0deg);
        }

        .face {
            position: absolute;
            width: 100px;
            height: 100px;
            background: #fff;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }

        .pip {
            width: 18px;
            height: 18px;
            background: #1e293b;
            border-radius: 50%;
            position: absolute;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }

        .front  { transform: translateZ(50px); }
        .front .pip { position: relative; }
        
        .back   { transform: rotateY(180deg) translateZ(50px); }
        .back .pip:nth-child(1) { top: 15px; left: 15px; }
        .back .pip:nth-child(2) { bottom: 15px; right: 15px; }

        .right  { transform: rotateY(90deg) translateZ(50px); }
        .right .pip:nth-child(1) { top: 15px; left: 15px; }
        .right .pip:nth-child(2) { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .right .pip:nth-child(3) { bottom: 15px; right: 15px; }

        .left   { transform: rotateY(-90deg) translateZ(50px); }
        .left .pip:nth-child(1) { top: 15px; left: 15px; }
        .left .pip:nth-child(2) { top: 15px; right: 15px; }
        .left .pip:nth-child(3) { bottom: 15px; left: 15px; }
        .left .pip:nth-child(4) { bottom: 15px; right: 15px; }

        .top    { transform: rotateX(90deg) translateZ(50px); }
        .top .pip:nth-child(1) { top: 15px; left: 15px; }
        .top .pip:nth-child(2) { top: 15px; right: 15px; }
        .top .pip:nth-child(3) { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .top .pip:nth-child(4) { bottom: 15px; left: 15px; }
        .top .pip:nth-child(5) { bottom: 15px; right: 15px; }

        .bottom { transform: rotateX(-90deg) translateZ(50px); }
        .bottom .pip:nth-child(1) { top: 15px; left: 15px; }
        .bottom .pip:nth-child(2) { top: 15px; right: 15px; }
        .bottom .pip:nth-child(3) { top: 50%; left: 15px; transform: translateY(-50%); }
        .bottom .pip:nth-child(4) { top: 50%; right: 15px; transform: translateY(-50%); }
        .bottom .pip:nth-child(5) { bottom: 15px; left: 15px; }
        .bottom .pip:nth-child(6) { bottom: 15px; right: 15px; }

        .controls {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            flex: 1;
            max-width: 200px;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.2);
        }

        .btn-roll { background: #3b82f6; color: white; }
        .btn-roll:hover { background: #2563eb; }

        .btn-hold { background: #f59e0b; color: white; }
        .btn-hold:hover { background: #d97706; }

        .btn-new {
            background: #64748b;
            color: white;
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 15px;
            font-size: 0.9rem;
            flex: none;
        }
        .btn-new:hover { background: #475569; }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            position: absolute;
            bottom: -60px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            width: 100%;
            color: #4ade80;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: opacity 0.3s;
        }

        .winner-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .winner-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .winner-overlay h1 {
            font-size: 3rem;
            color: #fbbf24;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
            text-align: center;
        }

        .winner-overlay button { margin-top: 20px; }

        /* Robot Typing Indicator */
        .robot-typing {
            display: none;
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #f87171;
            white-space: nowrap;
        }

        .robot-typing.show { display: block; }
        .robot-typing span {
            animation: blink 1.4s infinite both;
        }
        .robot-typing span:nth-child(2) { animation-delay: 0.2s; }
        .robot-typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0% { opacity: 0.2; }
            20% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        @media (max-width: 500px) {
            .players-container { flex-direction: column; }
            .game-container { padding: 20px; }
            .btn { padding: 12px 15px; font-size: 1rem; }
            .dice { width: 80px; height: 80px; }
            .face { width: 80px; height: 80px; }
            .front  { transform: translateZ(40px); }
            .back   { transform: rotateY(180deg) translateZ(40px); }
            .right  { transform: rotateY(90deg) translateZ(40px); }
            .left   { transform: rotateY(-90deg) translateZ(40px); }
            .top    { transform: rotateX(90deg) translateZ(40px); }
            .bottom { transform: rotateX(-90deg) translateZ(40px); }
            .pip { width: 14px; height: 14px; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <button class="btn btn-new" onclick="initGame()">New Game</button>

        <div class="players-container">
            <!-- Player 1 (Human) -->
            <div class="player-card active" id="player1-card">
                <h2>You</h2>
                <div class="total-score" id="player1-total">0</div>
                <div class="current-score-box">
                    <div class="current-score-label">Round Score</div>
                    <div class="current-score" id="player1-current">0</div>
                </div>
            </div>
            
            <!-- Player 2 (Robot) -->
            <div class="player-card robot" id="player2-card">
                <h2>Robot 🤖</h2>
                <div class="robot-typing" id="robotTyping">
                    Thinking<span>.</span><span>.</span><span>.</span>
                </div>
                <div class="total-score" id="player2-total">0</div>
                <div class="current-score-box">
                    <div class="current-score-label">Round Score</div>
                    <div class="current-score" id="player2-current">0</div>
                </div>
            </div>
        </div>

        <div class="dice-area">
            <div class="dice" id="dice">
                <div class="face front"><div class="pip"></div></div>
                <div class="face back">
                    <div class="pip"></div><div class="pip"></div>
                </div>
                <div class="face right">
                    <div class="pip"></div><div class="pip"></div><div class="pip"></div>
                </div>
                <div class="face left">
                    <div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div>
                </div>
                <div class="face top">
                    <div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div>
                </div>
                <div class="face bottom">
                    <div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-roll" id="rollBtn" onclick="playerRoll()">Roll Dice</button>
            <button class="btn btn-hold" id="holdBtn" onclick="playerHold()">Hold</button>
        </div>

        <div class="message" id="message"></div>

        <!-- Winner Screen -->
        <div class="winner-overlay" id="winnerOverlay">
            <h1 id="winnerText">You Win!</h1>
            <button class="btn btn-roll" onclick="initGame()">Play Again</button>
        </div>
    </div>

    <script>
        // Game State
        let scores = [0, 0];
        let currentScore = 0;
        let activePlayer = 0; // 0 = Human, 1 = Robot
        let isPlaying = true;
        let isAnimating = false;
        const WINNING_SCORE = 50;
        
        // Robot AI threshold: Hold if round score is 20 or more
        const ROBOT_HOLD_THRESHOLD = 20;

        // DOM Elements
        const diceEl = document.getElementById('dice');
        const p1Card = document.getElementById('player1-card');
        const p2Card = document.getElementById('player2-card');
        const p1Total = document.getElementById('player1-total');
        const p2Total = document.getElementById('player2-total');
        const p1Current = document.getElementById('player1-current');
        const p2Current = document.getElementById('player2-current');
        const rollBtn = document.getElementById('rollBtn');
        const holdBtn = document.getElementById('holdBtn');
        const messageEl = document.getElementById('message');
        const winnerOverlay = document.getElementById('winnerOverlay');
        const winnerText = document.getElementById('winnerText');
        const robotTyping = document.getElementById('robotTyping');

        // Dice rotations to snap to correct faces
        const rotations = {
            1: { x: 0, y: 0 },
            2: { x: 0, y: 180 },
            3: { x: 0, y: -90 },
            4: { x: 0, y: 90 },
            5: { x: -90, y: 0 },
            6: { x: 90, y: 0 }
        };

        // Audio Context for Sound Effects
        let audioCtx;
        function playSound(type) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;

            if (type === 'roll') {
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(300, now);
                oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                oscillator.start(now);
                oscillator.stop(now + 0.1);
            } else if (type === 'score') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(400, now);
                oscillator.frequency.setValueAtTime(600, now + 0.1);
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                oscillator.start(now);
                oscillator.stop(now + 0.3);
            } else if (type === 'fail') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, now);
                oscillator.frequency.linearRampToValueAtTime(80, now + 0.3);
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                oscillator.start(now);
                oscillator.stop(now + 0.3);
            }
        }

        function initGame() {
            scores = [0, 0];
            currentScore = 0;
            activePlayer = 0;
            isPlaying = true;
            isAnimating = false;
            
            p1Total.textContent = '0';
            p2Total.textContent = '0';
            p1Current.textContent = '0';
            p2Current.textContent = '0';
            
            p1Card.classList.add('active');
            p2Card.classList.remove('active');
            
            rollBtn.disabled = false;
            holdBtn.disabled = false;
            
            messageEl.textContent = '';
            winnerOverlay.classList.remove('show');
            robotTyping.classList.remove('show');
            
            diceEl.style.transform = `rotateX(0deg) rotateY(0deg)`;
        }

        // --- HUMAN TURN ACTIONS ---
        function playerRoll() {
            if (!isPlaying || activePlayer !== 0 || isAnimating) return;
            processRoll();
        }

        function playerHold() {
            if (!isPlaying || activePlayer !== 0 || isAnimating) return;
            holdScore();
        }

        // --- ROBOT TURN ACTIONS ---
        function robotTurn() {
            if (!isPlaying) return;
            
            // Show "thinking" indicator
            robotTyping.classList.add('show');
            
            // Delay before the robot rolls
            setTimeout(() => {
                robotTyping.classList.remove('show');
                if (currentScore >= ROBOT_HOLD_THRESHOLD) {
                    // Robot decides to hold
                    messageEl.textContent = "🤖 Robot holds!";
                    messageEl.style.color = "#f87171";
                    setTimeout(holdScore, 1000);
                } else {
                    // Robot decides to roll
                    processRoll();
                }
            }, 1200);
        }

        // --- SHARED GAME LOGIC ---
        function processRoll() {
            isAnimating = true;
            playSound('roll');
            rollBtn.disabled = true;
            holdBtn.disabled = true;

            const roll = Math.floor(Math.random() * 6) + 1;
            
            // Animate dice
            const randomSpinsX = Math.floor(Math.random() * 4 + 2) * 360;
            const randomSpinsY = Math.floor(Math.random() * 4 + 2) * 360;
            const targetX = rotations[roll].x + randomSpinsX;
            const targetY = rotations[roll].y + randomSpinsY;
            
            diceEl.style.transform = `rotateX(${targetX}deg) rotateY(${targetY}deg)`;

            setTimeout(() => {
                if (roll === 1) {
                    playSound('fail');
                    currentScore = 0;
                    updateUI();
                    messageEl.textContent = activePlayer === 0 ? "You rolled a 1! Turn skipped." : "🤖 Robot rolled a 1! Turn skipped.";
                    messageEl.style.color = "#ef4444";
                    
                    setTimeout(() => {
                        switchPlayer();
                    }, 1500);
                } else {
                    currentScore += roll;
                    updateUI();
                    messageEl.textContent = "";
                    isAnimating = false;
                    
                    if (activePlayer === 0) {
                        rollBtn.disabled = false;
                        holdBtn.disabled = false;
                    } else {
                        // Robot immediately decides what to do next after rolling
                        robotTurn();
                    }
                }
            }, 1000);
        }

        function holdScore() {
            if (currentScore === 0) {
                messageEl.textContent = "You must roll at least once!";
                messageEl.style.color = "#ef4444";
                return;
            }

            playSound('score');
            scores[activePlayer] += currentScore;
            updateUI();

            if (scores[activePlayer] >= WINNING_SCORE) {
                gameOver();
            } else {
                switchPlayer();
            }
        }

        function switchPlayer() {
            currentScore = 0;
            isAnimating = false;
            activePlayer = activePlayer === 0 ? 1 : 0;
            
            updateUI();
            messageEl.textContent = "";

            if (activePlayer === 0) {
                p1Card.classList.add('active');
                p2Card.classList.remove('active');
                rollBtn.disabled = false;
                holdBtn.disabled = false;
            } else {
                p2Card.classList.add('active');
                p1Card.classList.remove('active');
                rollBtn.disabled = true;
                holdBtn.disabled = true;
                // Give a brief pause before robot starts its turn
                setTimeout(robotTurn, 1000);
            }
        }

        function updateUI() {
            p1Total.textContent = scores[0];
            p2Total.textContent = scores[1];
            p1Current.textContent = activePlayer === 0 ? currentScore : 0;
            p2Current.textContent = activePlayer === 1 ? currentScore : 0;
        }

        function gameOver() {
            isPlaying = false;
            rollBtn.disabled = true;
            holdBtn.disabled = true;
            robotTyping.classList.remove('show');
            
            if (activePlayer === 0) {
                winnerText.textContent = "You Win! 🎉";
                winnerText.style.color = "#4ade80";
            } else {
                winnerText.textContent = "Robot Wins! 🤖";
                winnerText.style.color = "#f87171";
            }
            
            winnerOverlay.classList.add('show');
            playSound('score');
        }

        // Initialize game on load
        initGame();
    </script>
</body>
</html>
